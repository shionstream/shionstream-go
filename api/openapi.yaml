openapi: 3.1.0
info:
  contact:
    email: dev@gox.my.id
    name: ShionStream Engineering Team
    url: https://gox.my.id
  description: Modular anime streaming and metadata API built with Hono on Cloudflare
    Workers.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: ShionStream API
  version: 1.0.0
servers:
- description: Production Server
  url: https://api.gox.my.id
- description: Local Development
  url: http://localhost:8787
paths:
  /health:
    get:
      description: Check if the API and Cloudflare D1 database connection are healthy.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_health_get_200_response"
          description: Service is operational
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_health_get_500_response"
          description: Service is degraded
      summary: Health Check
      tags:
      - System
  /v1/protected/sample:
    get:
      description: Example endpoint that requires a valid Better Auth session or Bearer
        token.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_200_response"
          description: User is authenticated
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Protected Sample Endpoint
      tags:
      - Sample
  /v1/anime:
    get:
      description: "Retrieve paginated list of anime with filters for type, status,\
        \ season, year, genre, and search."
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: "1"
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: "20"
          type: string
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: type
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: genre
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: season
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: year
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: latest
          enum:
          - latest
          - popular
          - score
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_anime_get_200_response"
          description: Paginated anime list
      summary: List Anime Catalog
      tags:
      - Anime
  /v1/anime/{slug}:
    get:
      description: "Retrieve comprehensive anime metadata including associated genres,\
        \ studios, schedule, and trending stats."
      parameters:
      - explode: false
        in: path
        name: slug
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_anime__slug__get_200_response"
          description: Anime detailed metadata
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Anime not found
      summary: Get Anime Details by Slug
      tags:
      - Anime
  /v1/anime/{slug}/episodes:
    get:
      description: Retrieve an ordered list of published episodes for a specific anime.
      parameters:
      - explode: false
        in: path
        name: slug
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: "1"
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: "50"
          type: string
        style: form
      - explode: true
        in: query
        name: sort
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_anime__slug__episodes_get_200_response"
          description: List of anime episodes
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Anime not found
      summary: List Episodes by Anime Slug
      tags:
      - Episodes
  /v1/episodes/{id}/stream:
    get:
      description: "Retrieve video playback manifests, multi-resolution URLs, subtitles,\
        \ and audio tracks for an episode."
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_episodes__id__stream_get_200_response"
          description: Stream sources and media tracks
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Episode not found
      summary: Get Episode Stream Sources
      tags:
      - Episodes
  /v1/user/profile:
    get:
      description: Retrieves the authenticated user's profile with activity summary
        (watchlist count and recent history count).
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_profile_get_200_response"
          description: User profile
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Get User Profile
      tags:
      - User
  /v1/user/settings:
    get:
      description: Retrieves player preferences and notification settings for the
        authenticated user.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_settings_get_200_response"
          description: User settings
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Get User Settings
      tags:
      - User
    patch:
      description: Updates player preferences and notification settings.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_user_settings_patch_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_settings_patch_200_response"
          description: Settings updated
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Update User Settings
      tags:
      - User
  /v1/user/watchlist:
    get:
      description: Retrieves the authenticated user's anime watchlist with optional
        status filter.
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_watchlist_get_200_response"
          description: Watchlist items
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Get User Watchlist
      tags:
      - User
    post:
      description: Adds an anime to the user's watchlist. Upserts if the anime already
        exists in the watchlist.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_user_watchlist_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_settings_patch_200_response"
          description: Added to watchlist
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Add to Watchlist
      tags:
      - User
  /v1/user/watchlist/{animeId}:
    delete:
      description: Removes an anime from the user's watchlist.
      parameters:
      - explode: false
        in: path
        name: animeId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_settings_patch_200_response"
          description: Removed
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Remove from Watchlist
      tags:
      - User
    patch:
      description: Updates status or favorite flag for a specific anime in the user's
        watchlist.
      parameters:
      - explode: false
        in: path
        name: animeId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_user_watchlist__animeId__patch_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_settings_patch_200_response"
          description: Watchlist updated
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Update Watchlist Entry
      tags:
      - User
  /v1/user/history:
    delete:
      description: Clears the authenticated user's entire watch history.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_settings_patch_200_response"
          description: History cleared
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Clear All History
      tags:
      - User
    get:
      description: Retrieves the authenticated user's watch history sorted by most
        recent.
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: "50"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_history_get_200_response"
          description: Watch history
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Get Watch History
      tags:
      - User
    post:
      description: "Records or updates playback progress for an episode (heartbeat).\
        \ Upserts on [userId, episodeId]."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_user_history_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_settings_patch_200_response"
          description: Progress recorded
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Record Playback Progress
      tags:
      - User
  /v1/user/history/{id}:
    delete:
      description: Deletes a single watch history record.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_user_settings_patch_200_response"
          description: Deleted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Delete History Item
      tags:
      - User
  /v1/comments:
    get:
      description: "Retrieves threaded comments for an episode, ordered by newest\
        \ first, with like/dislike counts."
      parameters:
      - explode: true
        in: query
        name: episodeId
        required: true
        schema:
          minLength: 1
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_comments_get_200_response"
          description: Comments list
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Missing episodeId
      summary: Get Episode Comments
      tags:
      - Comments
    post:
      description: Creates a new comment or reply on an episode. Supports both authenticated
        users and guests (guest requires name and email).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_comments_post_request"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_comments_post_201_response"
          description: Comment created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Validation error
      summary: Create Comment
      tags:
      - Comments
  /v1/comments/{id}/like:
    post:
      description: "Adds or toggles a like/dislike reaction on a comment. Upserts\
        \ on [commentId, userId]."
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_comments__id__like_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_comments__id__like_post_200_response"
          description: Reaction recorded
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
      security:
      - Bearer: []
      summary: Like or Dislike Comment
      tags:
      - Comments
  /v1/comments/{id}/report:
    post:
      description: Submits a comment to the moderation queue with a reason.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_comments__id__report_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_comments__id__like_post_200_response"
          description: Report submitted
      summary: Report Comment
      tags:
      - Comments
  /v1/dashboard/stats:
    get:
      description: "Returns aggregated platform metrics including anime count, episode\
        \ count, user count, and storage estimates."
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_dashboard_stats_get_200_response"
          description: Aggregated stats
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Forbidden
      security:
      - Bearer: []
      summary: Get Platform Stats
      tags:
      - Dashboard
  /v1/dashboard/overview:
    get:
      description: "Returns traffic telemetry, recent activity logs, and administrative\
        \ notifications."
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_dashboard_overview_get_200_response"
          description: Overview data
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Forbidden
      security:
      - Bearer: []
      summary: Get Dashboard Overview
      tags:
      - Dashboard
  /v1/dashboard/anime:
    get:
      description: Returns paginated anime catalog with filters for administration.
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: "1"
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: "20"
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_dashboard_anime_get_200_response"
          description: Paginated anime list
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Forbidden
      security:
      - Bearer: []
      summary: Get Administrative Anime List
      tags:
      - Dashboard
  /v1/dashboard/episodes:
    get:
      description: Returns paginated episodes with upload status for administration.
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: "1"
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: "20"
          type: string
        style: form
      - explode: true
        in: query
        name: animeId
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_dashboard_episodes_get_200_response"
          description: Paginated episodes list
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Forbidden
      security:
      - Bearer: []
      summary: Get Administrative Episodes List
      tags:
      - Dashboard
  /v1/dashboard/users:
    get:
      description: Returns registered users directory with role and status information.
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: "1"
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: "20"
          type: string
        style: form
      - explode: true
        in: query
        name: role
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_dashboard_users_get_200_response"
          description: Paginated user directory
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Forbidden
      security:
      - Bearer: []
      summary: Get Users Directory (Admin Only)
      tags:
      - Dashboard
  /v1/dashboard/categories:
    get:
      description: Returns format categories and genres with associated anime counts.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_dashboard_categories_get_200_response"
          description: Category and genre statistics
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Forbidden
      security:
      - Bearer: []
      summary: Get Category & Genre Distributions
      tags:
      - Dashboard
  /v1/dashboard/seasons:
    get:
      description: Returns anime release distribution grouped by season and year.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_dashboard_seasons_get_200_response"
          description: Seasonal distribution
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Forbidden
      security:
      - Bearer: []
      summary: Get Seasonal Broadcast Distributions
      tags:
      - Dashboard
  /v1/dashboard/roles:
    get:
      description: Returns role definitions and active user member counts.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_dashboard_roles_get_200_response"
          description: Role definitions
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Forbidden
      security:
      - Bearer: []
      summary: Get System Roles & Permissions
      tags:
      - Dashboard
  /v1/dashboard/moderation:
    get:
      description: Returns reported comments queue with status filter.
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: pending
          enum:
          - pending
          - resolved
          - dismissed
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_dashboard_moderation_get_200_response"
          description: Moderation reports list
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_protected_sample_get_401_response"
